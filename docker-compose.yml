version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: cds_postgres
    environment:
      POSTGRES_USER: cds_user
      POSTGRES_PASSWORD: cds_password
      POSTGRES_DB: cds_knowledge_base
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis_cache:
    image: redis:7-alpine
    container_name: cds_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
